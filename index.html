<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reach</title>
<meta name="description" content="Your private network, searchable by need.">
<meta name="theme-color" content="#14213D">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reach">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14213D; --ink-2:#4F5B76; --paper:#F1F4F9; --card:#FFFFFF; --line:#D9E0EA;
  --sun:#F2A900; --sun-ink:#3A2A00; --go:#1F8A5B; --go-soft:#E3F3EB; --danger:#B42318; --danger-soft:#FDECEA;
  --blue:#2458C7; --blue-soft:#E4ECFD; --violet:#6D3FC9; --violet-soft:#EFE8FC; --amber:#9A5B00; --amber-soft:#FFF0D1; --grey-soft:#ECEFF4;
  --chip:#E8EDF5; --shadow:0 18px 40px -24px rgba(20,33,61,.45);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#E9EEF7; --ink-2:#A6B1C7; --paper:#0E1629; --card:#17223A; --line:#2A3752;
    --sun:#F5B820; --sun-ink:#2A1E00; --go:#3FBF86; --go-soft:#16352A; --danger:#FF7A6E; --danger-soft:#3A1D1F;
    --blue:#8CB0FF; --blue-soft:#1C2C52; --violet:#C3A6FF; --violet-soft:#2C2150; --amber:#FFC266; --amber-soft:#3A2B10; --grey-soft:#212C44;
    --chip:#223050; --shadow:0 18px 40px -24px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ink:#E9EEF7; --ink-2:#A6B1C7; --paper:#0E1629; --card:#17223A; --line:#2A3752;
  --sun:#F5B820; --sun-ink:#2A1E00; --go:#3FBF86; --go-soft:#16352A; --danger:#FF7A6E; --danger-soft:#3A1D1F;
  --blue:#8CB0FF; --blue-soft:#1C2C52; --violet:#C3A6FF; --violet-soft:#2C2150; --amber:#FFC266; --amber-soft:#3A2B10; --grey-soft:#212C44;
  --chip:#223050; --shadow:0 18px 40px -24px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
img{max-width:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 130px}
.muted{color:var(--ink-2)}
.grow{flex:1;min-width:0}

/* top bar */
.top{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bar{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 8px}
.brand{font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 4px color-mix(in srgb,var(--sun) 30%,transparent)}
.sync{font-size:.8rem;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line)}
.sync.on::before{background:var(--go)}

/* hero search */
.ask{margin:14px 0 6px}
.ask h1{font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,8vw,3.2rem);line-height:1.02;letter-spacing:-.035em;margin:0}
.ask .field{position:relative;margin-top:4px}
.ask textarea{width:100%;border:0;border-bottom:4px solid var(--sun);background:transparent;font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,6.6vw,2.6rem);letter-spacing:-.03em;line-height:1.15;padding:2px 44px 8px 0;outline:none;color:var(--ink);resize:none;overflow:hidden;min-height:1.3em;display:block}
.ask textarea::placeholder{color:color-mix(in srgb,var(--ink-2) 55%,transparent)}
.ask textarea:focus-visible{border-bottom-color:var(--ink);outline:none}
.clear{position:absolute;right:0;top:6px;border:0;background:var(--chip);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.1rem}
.ask-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.hint{color:var(--ink-2);font-size:.92rem;margin:0}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap-chips{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.88rem;cursor:pointer;white-space:nowrap;text-align:left}
.chip.q{border-style:dashed;background:transparent}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* sections */
.sec-h{font-family:var(--display);font-size:1.15rem;font-weight:700;letter-spacing:-.01em;margin:26px 2px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-h small{font-family:var(--body);font-weight:500;font-size:.85rem;color:var(--ink-2)}
.link{border:0;background:transparent;color:var(--blue);font-weight:600;cursor:pointer;padding:4px 0;font-size:.9rem}
.note{font-size:.88rem;color:var(--ink-2);margin:-4px 2px 10px}

/* lists */
.list{list-style:none;margin:0;padding:0;background:var(--card);border-radius:20px;border:1px solid var(--line);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0}
.list > .item:first-child,.list > li:first-child > .item{border-top:0}
.item:hover{background:color-mix(in srgb,var(--chip) 50%,transparent)}
.av{flex:none;width:50px;height:50px;border-radius:15px;object-fit:cover;background:var(--chip);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.1rem;color:var(--ink)}
.av.sm{width:30px;height:30px;border-radius:9px;font-size:.75rem}
.av.lg{width:108px;height:108px;border-radius:32px;font-size:2.3rem}
.av.md{width:76px;height:76px;border-radius:22px;font-size:1.6rem}
.p-name{font-weight:700;font-size:1.02rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-sub{color:var(--ink-2);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--sun)}
.why{font-size:.84rem;color:var(--ink-2);margin-top:4px;line-height:1.35;white-space:normal}
.why b{color:var(--ink);font-weight:600}
.path{font-size:.8rem;margin-top:6px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;color:var(--ink-2)}
.path .pill{background:var(--chip);color:var(--ink);border-radius:7px;padding:2px 8px;font-weight:600;border:0;font-size:.8rem;cursor:pointer}
.path .pill.me{background:var(--sun);color:var(--sun-ink)}
.path .pill.target{background:var(--ink);color:var(--paper)}
.path .pill.ext{background:transparent;border:1px dashed var(--line);cursor:default}
.call{flex:none;width:44px;height:44px;border-radius:50%;background:var(--go-soft);color:var(--go);display:grid;place-items:center;border:0;text-decoration:none;cursor:pointer}
.call svg{width:20px;height:20px}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:.76rem;font-weight:600;background:var(--chip);border-radius:6px;padding:2px 8px;border:0}
button.tag{cursor:pointer}
.tag.hit{background:var(--sun);color:var(--sun-ink)}

/* experiences */
.exp{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.exp.t-fact{border-left-color:var(--go)} .exp.t-personal{border-left-color:var(--blue)} .exp.t-opinion{border-left-color:var(--violet)} .exp.t-report{border-left-color:var(--ink-2)} .exp.t-unverified{border-left-color:var(--amber)}
.exp h4{margin:4px 0 2px;font-size:1rem;line-height:1.3}
.exp h4 small{font-weight:500;color:var(--ink-2)}
.exp p{margin:0;font-size:.92rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.exp .src{font-size:.82rem;color:var(--ink-2);margin-top:6px}
.exp-top{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:.8rem;color:var(--ink-2)}
.badge{display:inline-block;font-size:.74rem;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap}
.b-fact{background:var(--go-soft);color:var(--go)} .b-personal{background:var(--blue-soft);color:var(--blue)} .b-opinion{background:var(--violet-soft);color:var(--violet)} .b-report{background:var(--grey-soft);color:var(--ink-2)} .b-unverified{background:var(--amber-soft);color:var(--amber)}
.b-vis{background:var(--grey-soft);color:var(--ink)}

/* AI */
.ai{background:var(--card);border:2px solid var(--sun);border-radius:20px;padding:16px;margin-top:18px}
.ai-h{font-family:var(--display);font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ai-h svg{width:18px;height:18px;color:var(--sun)}
.ai p{margin:0 0 8px}
.ai .srcs{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ai .src-row{display:flex;gap:10px;align-items:flex-start;border:0;background:var(--paper);border-radius:12px;padding:8px 10px;text-align:left;cursor:pointer;width:100%}
.ai .foot{font-size:.8rem;color:var(--ink-2);margin-top:10px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--sun);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* buttons */
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-size:.95rem;line-height:1.2}
.btn svg{width:18px;height:18px}
.btn.sm{padding:7px 12px;font-size:.85rem;border-radius:10px}
.btn.primary{background:var(--sun);color:var(--sun-ink)}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 40%,transparent)}
.btn[disabled]{opacity:.5;cursor:default}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row.stretch .btn{flex:1}

.empty{background:var(--card);border:1px dashed var(--line);border-radius:20px;padding:26px 20px;text-align:center;margin-top:14px}
.empty h2{font-family:var(--display);font-size:1.35rem;margin:0 0 6px;letter-spacing:-.02em}
.empty p{color:var(--ink-2);margin:0 auto 16px;max-width:40ch}
.empty .btn-row{justify-content:center}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
@media (min-width:760px){.tabs{max-width:560px;margin:0 auto;bottom:14px;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:600;color:var(--ink-2);padding:4px 0;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{color:var(--ink);stroke-width:2.4}
.tab .plus{width:46px;height:40px;border-radius:14px;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center}
.tab .plus svg{width:24px;height:24px;stroke-width:2.6}

/* network toolbar */
.segs{display:flex;gap:4px;background:var(--chip);border-radius:14px;padding:4px;margin:14px 0 10px}
.segs button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px 4px;font-weight:700;font-size:.88rem;color:var(--ink-2);cursor:pointer}
.segs button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.page-h{font-family:var(--display);font-weight:800;font-size:2rem;letter-spacing:-.03em;margin:14px 0 0;line-height:1.1}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tools select,.search-in{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:8px 10px;font-weight:600;font-size:.88rem;max-width:100%}
.search-in{width:100%;font-weight:500;font-size:1rem;padding:11px 12px;margin-bottom:8px}
.check-inline{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;font-weight:600}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.stat b{font-family:var(--display);font-size:1.9rem;display:block;line-height:1;letter-spacing:-.03em}
.stat span{font-size:.85rem;color:var(--ink-2)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 16px}
.bar-row{display:grid;grid-template-columns:minmax(90px,38%) 1fr 34px;gap:10px;align-items:center;font-size:.86rem;padding:7px 0}
.bar-row span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:10px;background:var(--chip);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;background:var(--ink);border-radius:6px}
.bar-row b{text-align:right}
.alert-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.panel > .alert-row:first-child{border-top:0}

/* switches & settings */
.switch{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line);cursor:pointer}
.panel > .switch:first-child,.panel > .setting:first-child{border-top:0}
.switch .t,.setting .t{font-weight:600}
.switch small,.setting small{display:block;color:var(--ink-2);font-weight:500;font-size:.84rem;line-height:1.35}
.switch input{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked{background:var(--go)}
.switch input:checked::after{transform:translateX(20px)}
.setting{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line)}
.setting select{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 8px;font-weight:600;max-width:48%}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:.92rem}
.panel > .kv:first-child{border-top:0}
.kv b{font-weight:600;text-align:right}
.ok{color:var(--go)} .no{color:var(--ink-2)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,16,30,.5);z-index:40;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:94vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:0 18px calc(26px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.sheet.anim{animation:up .22s ease-out}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:24px;max-height:90vh}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet.anim{animation:none}.spin{animation-duration:2s}}
.sh-head{position:sticky;top:0;background:var(--card);z-index:3;display:flex;align-items:center;gap:8px;padding:12px 0 8px}
.sh-head h2{flex:1;font-family:var(--display);font-size:1.25rem;letter-spacing:-.02em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:12px;height:40px;min-width:40px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:.9rem;flex:none}
.icon-btn svg{width:18px;height:18px}

/* forms */
label.f{display:block;font-weight:600;font-size:.88rem;margin-bottom:12px}
label.f small{font-weight:500;color:var(--ink-2)}
.f input,.f textarea,.f select{display:block;width:100%;margin-top:5px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:11px 12px;font-size:1rem;font-weight:500}
.f textarea{min-height:88px;resize:vertical}
.f input:focus,.f textarea:focus,.f select:focus{outline:none;border-color:var(--sun);box-shadow:0 0 0 3px color-mix(in srgb,var(--sun) 30%,transparent)}
.grid2{display:grid;gap:0 12px;grid-template-columns:1fr}
@media (min-width:520px){.grid2{grid-template-columns:1fr 1fr}}
fieldset{border:0;padding:0;margin:6px 0 10px}
legend,.fs-title{font-family:var(--display);font-weight:700;font-size:1.05rem;margin-bottom:8px;padding:0}
details.fs{border-top:1px solid var(--line);padding:10px 0 2px}
details.fs summary{font-family:var(--display);font-weight:700;font-size:1.05rem;cursor:pointer;list-style:none;display:flex;justify-content:space-between;padding:4px 0 10px}
details.fs summary::-webkit-details-marker{display:none}
details.fs summary::after{content:"+";font-weight:700;color:var(--ink-2)}
details.fs[open] summary::after{content:"–"}
.form-actions{display:flex;gap:10px;position:sticky;bottom:-26px;background:var(--card);padding:12px 0 6px;margin-top:6px;z-index:2}
.form-actions .btn{flex:1}
.err{color:var(--danger);font-size:.85rem;margin:-6px 0 10px}
.photo-pick{display:flex;align-items:center;gap:14px;margin:4px 0 14px}
.seg-radio{display:flex;gap:6px;margin-top:6px}
.seg-radio label{flex:1;position:relative}
.seg-radio input{position:absolute;opacity:0;inset:0;margin:0}
.seg-radio span{display:block;text-align:center;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 0;font-weight:700;cursor:pointer;font-size:.9rem}
.seg-radio input:checked + span{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg-radio input:focus-visible + span{outline:3px solid var(--sun);outline-offset:2px}
.cb{display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:.9rem;margin:4px 0 12px;cursor:pointer}
.cb input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--ink);flex:none}
.cb small{display:block;font-weight:500;color:var(--ink-2)}

/* profile */
.d-head{text-align:center;padding:4px 0 6px}
.d-head .av{margin:0 auto 12px}
.d-head h3{font-family:var(--display);font-size:1.75rem;letter-spacing:-.03em;margin:0;line-height:1.1}
.d-head p{color:var(--ink-2);margin:4px 0 0}
.d-head .tags{justify-content:center;margin-top:8px}
.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0 12px}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px;border-radius:14px;background:var(--chip);border:0;cursor:pointer;text-decoration:none;color:var(--ink);font-size:.76rem;font-weight:600}
.act svg{width:21px;height:21px}
.act.go{background:var(--go-soft);color:var(--go)}
.act[aria-disabled="true"]{opacity:.35;pointer-events:none}

.fup{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.fup:first-of-type{border-top:0}
.checkbtn{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:transparent;cursor:pointer;flex:none;display:grid;place-items:center;color:var(--paper)}
.checkbtn.done{background:var(--go);border-color:var(--go)}
.checkbtn svg{width:16px;height:16px}
.due{font-size:.8rem;color:var(--ink-2)}
.due.over{color:var(--danger);font-weight:700}

/* graph */
.graph{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px;overflow:hidden}
.graph svg{width:100%;height:auto;display:block;max-height:560px}
.graph .node{cursor:pointer}
.graph .node:focus-visible{outline:none}
.graph .node:focus-visible circle{stroke:var(--sun);stroke-width:4}
.route{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.route .path{margin-top:0}
.route .why{margin-top:6px}
.route .btn-row{margin-top:10px}

.imp .badge{margin-left:auto}
.qr{display:grid;place-items:center;background:#fff;border-radius:20px;padding:16px;margin:10px auto;width:max-content;max-width:100%}

.toast button{border:0;background:var(--sun);color:var(--sun-ink);font-weight:700;border-radius:9px;padding:5px 10px;cursor:pointer}

.path .pill{display:inline-flex;align-items:center;gap:5px}

.auth{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px}

.auth-h{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,7vw,2.2rem);letter-spacing:-.03em;line-height:1.05;margin:0 0 6px}
.auth-card .muted{margin:0 0 18px}
.auth-links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px}
.or{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:.85rem;margin:14px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

/* chat */
.chat{max-height:52vh;overflow-y:auto;padding:4px 0 8px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:88%;padding:10px 13px;border-radius:18px;font-size:.96rem;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--ink);color:var(--paper);border-bottom-right-radius:6px}
.bub.ai{align-self:flex-start;background:var(--chip);border-bottom-left-radius:6px}
.bub.err-bub{background:var(--danger-soft)}
.bub .srcs{display:flex;flex-direction:column;gap:6px;margin-top:8px}

.chat-bar input{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 14px;font-size:1rem}

.chat-bar .btn{padding:12px 16px}

    { label: "Company", w: 3, vals: [p.company] },
    { label: "Location", w: 3, vals: [p.city, p.address] },
    { label: "Tag", w: 3, vals: p.tags || [] },
    { label: "Experience", w: 3, vals: exps.map(e => e.topic + (e.entity ? " (" + e.entity + ")" : "")) },
    { label: "Relationship", w: 2, vals: [p.relType] },
    { label: "Met", w: 2, vals: [p.metWhere, p.metType] },
    { label: "Introduced by", w: 2, vals: [intro && intro.name] },
    { label: "Notes", w: 1, vals: [p.notes], snip: true },

function searchPeople(parsed) {
  const { terms } = parsed; const full = [], partial = [];
  if (!terms.length) return { full, partial };
  for (const p of S.people) {
    if (p.archived) continue;
    const fields = personFields(p); const hits = []; let s = 0;
    for (const t of terms) { const m = matchTerm(fields, t); if (m) { hits.push(m); s += m.s; } }
    if (!hits.length) continue;
    s += (Number(p.strength) || 0) * 0.4;
    (hits.length === terms.length ? full : partial).push({ p, s, hits });
  }
  full.sort((a, b) => b.s - a.s);
  partial.sort((a, b) => b.hits.length - a.hits.length || b.s - a.s);
  return { full, partial: partial.slice(0, 20) };
}
function searchExps(parsed) {
  const { terms } = parsed; if (!terms.length) return [];
  const out = [];
  for (const e of S.exps) {
    const fields = [
      { label: "Topic", w: 4, vals: [e.topic] }, { label: "Organization", w: 4, vals: [e.entity] },
      { label: "Source", w: 2, vals: [nameOf(e.sourceId, e.sourceName)] },
      { label: "Description", w: 2, vals: [e.description], snip: true }, { label: "Evidence", w: 1, vals: [e.evidence], snip: true },
    ];
    const hits = []; let s = 0;
    for (const t of terms) { const m = matchTerm(fields, t); if (m) { hits.push(m); s += m.s; } }
    if (hits.length === terms.length || (hits.length && hits.length >= Math.ceil(terms.length / 2) && parsed.intent.exp)) out.push({ e, s: s + hits.length * 2, hits });
  }
  return out.sort((a, b) => b.s - a.s).slice(0, 25);
}
function reasonText(hits) {
  return hits.map(h => {
    const t = esc(trunc(h.text, 46));
    if (h.label === "Notes" || h.label === "Experience notes" || h.label === "Interaction" || h.label === "Description" || h.label === "Evidence") return `${h.label.toLowerCase()} mention “${t}”`;
    return `${h.label.toLowerCase()} ${t}`;
  }).join(" + ");
}

let toastTimer;
function toast(msg, action) {

  if (action) t.querySelector("button").onclick = () => { t.classList.remove("show"); action.fn(); };
  t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), action ? 5000 : 2600);
}
function copyText(text, label) {
  const done = () => toast((label || "Copied") + "");
  const fallback = () => { const a = document.createElement("textarea"); a.value = text; a.style.position = "fixed"; a.style.opacity = "0"; document.body.appendChild(a); a.select(); try { document.execCommand("copy"); done(); } catch (e) { toast(text); } a.remove(); };

}

/* ================= sheet stack ================= */
const Sheet = {
  stack: [], lastFocus: null,
  top() { return this.stack[this.stack.length - 1]; },
  open(entry) { if (!this.stack.length) this.lastFocus = document.activeElement; this.stack.push(entry); this.draw(true); },
  replace(entry) { this.stack[this.stack.length - 1] = entry; this.draw(true); },
  back() { const t = this.stack.pop(); if (t && t.onClose) t.onClose(); if (this.stack.length) this.draw(true); else this.hide(); },
  closeAll() { this.stack.forEach(t => { if (t.onClose) t.onClose(); }); this.stack = []; this.hide(); },
  hide() { $("#scrim").classList.remove("open"); document.body.style.overflow = ""; S.pendingLog = null; if (this.lastFocus && this.lastFocus.focus) { try { this.lastFocus.focus({ preventScroll: true }); } catch (e) { } } },
  head(e) {
    return `<div class="sh-head">${this.stack.length > 1 ? `<button class="icon-btn" data-a="sheetBack" aria-label="Back">${ICON.back}</button>` : ""}<h2 id="sheetTitle">${esc(typeof e.title === "function" ? e.title() : e.title)}</h2><button class="icon-btn" data-a="sheetClose" aria-label="Close">${ICON.close}</button></div>`;
  },
  draw(fresh) {
    const e = this.top(); const el = $("#sheet");
    $("#scrim").classList.add("open"); document.body.style.overflow = "hidden";
    el.innerHTML = this.head(e) + e.render(e);
    if (fresh) { el.scrollTop = 0; el.classList.remove("anim"); void el.offsetWidth; el.classList.add("anim"); }
    if (e.mount) e.mount(el, e);
    if (fresh) { const f = el.querySelector("[autofocus]"); if (f && window.matchMedia("(min-width:700px)").matches) f.focus(); else el.querySelector(".sh-head .icon-btn:last-child").focus({ preventScroll: true }); }
  },
  refresh() {
    const e = this.top(); if (!e || !e.live) return;
    const el = $("#sheet"); const active = document.activeElement;
    if (active && el.contains(active) && /INPUT|TEXTAREA|SELECT/.test(active.tagName)) return;
    const kept = {}; $$("form[data-keep] [name]", el).forEach(i => { if (i.type !== "checkbox" && i.value) kept[i.form.dataset.form + ":" + i.name] = i.value; });
    const top = el.scrollTop; el.innerHTML = this.head(e) + e.render(e); el.scrollTop = top;
    $$("form[data-keep] [name]", el).forEach(i => { const k = i.form.dataset.form + ":" + i.name; if (kept[k] != null) i.value = kept[k]; });
    if (e.mount) e.mount(el, e);
  },
};

/* ================= AI search (server) ================= */
function aiErrorText(e) {
  switch (e && e.code) {
    case "offline": return "You're offline. Local results are shown below.";
    case "quota_exceeded": return "You've reached today's AI limit. It resets tomorrow. Local search still works.";
    case "ai_not_configured": return "AI isn't set up on your server yet. Add your Anthropic API key in Supabase, under Edge Functions secrets.";
    case "not_deployed": return "The reach-ai server function isn't deployed yet. Follow step 5 of the setup guide.";
    case "ai_key_invalid": return "Your Anthropic API key was rejected. Check the key saved in Supabase.";
    case "ai_no_credit": return "Your Anthropic account is out of credit. Add credit to use AI again.";
    case "ai_busy": return "The AI service is busy. Try again in a minute.";
    case "ai_disabled": return "AI search is turned off in your privacy settings.";
    case "unauthorized": return "Your session expired. Sign in again.";
    case "cancelled": return "Stopped.";
    default: return "The AI answer didn't come through. Local results are still shown below.";
  }
}
let aiToken = 0;
async function askAI(auto) {
  const q = S.q.trim(); if (!q || !aiAvailable()) return;
  if (S.ai && S.ai.status === "thinking" && S.ai.q === q) return;
  if (S.aiCache[q]) { S.ai = { q, status: "done", result: S.aiCache[q].result, sent: S.aiCache[q].sent }; renderHome(); return; }
  const token = ++aiToken;
  S.ai = { q, status: "thinking", token, auto: !!auto };
  renderHome();
  try {
    const r = await invokeAI({ action: "search", query: q });
    if (token !== aiToken || !S.ai || S.ai.token !== token) return;
    const people = (r.people || []).filter(x => x && personById(x.id));
    const exps = (r.experiences || []).filter(x => x && expById(x.id));
    const result = { answer: String(r.answer || ""), people, exps, gaps: String(r.gaps || "") };
    S.aiCache[q] = { result, sent: r.sent || 0 };
    S.ai = { q, status: "done", result, sent: r.sent || 0, remaining: r.remainingToday };
    metric("aiSearches");
    S.lastPull = 0;
  } catch (e) {
    if (token !== aiToken) return;
    S.ai = { q, status: "error", error: aiErrorText(e), code: e && e.code };
    if (e && e.code === "not_deployed") S.aiServer = "not_deployed";
    if (e && e.code === "ai_not_configured") S.aiServer = "not_configured";
  }
  if (S.view === "home") renderHome();
}
function aiBox() {
  const a = S.ai;
  const head = `<div class="ai-h">${ICON.spark} Smart search</div>`;
  if (a.status === "thinking") return `<div class="ai">${head}<p><span class="spin" aria-hidden="true"></span>Searching your network by meaning…</p><button class="btn ghost sm" data-a="stopAI">Stop</button></div>`;
  if (a.status === "error") return a.code === "cancelled" ? "" : `<div class="ai">${head}<p>${esc(a.error)}</p></div>`;
  const r = a.result;
  const ppl = r.people.map(x => { const p = personById(x.id); return p ? `<button class="src-row" data-a="openPerson" data-id="${esc(p.id)}" data-from="search">${avatar(p, "sm")}<div class="grow"><div style="font-weight:700">${esc(p.name)}</div><div class="why" style="margin:0">${esc(x.reason || "")}</div></div></button>` : ""; }).join("");
  const exs = r.exps.map(x => { const e = expById(x.id); return e ? `<button class="src-row" data-a="openExp" data-id="${esc(e.id)}"><span class="badge b-${EXP_CLASS[e.type] || "report"}">${esc(e.type)}</span><div class="grow"><div style="font-weight:700">${esc(e.topic)}</div><div class="why" style="margin:0">${esc(x.reason || "")}</div></div></button>` : ""; }).join("");
  return `<div class="ai">${head}<p>${esc(r.answer || "No summary was returned.")}</p>
    ${r.gaps ? `<p class="muted" style="font-size:.9rem"><b>Gaps or uncertainty:</b> ${esc(r.gaps)}</p>` : ""}
    ${ppl || exs ? `<div class="srcs">${ppl}${exs}</div>` : ""}
    <div class="foot">Drawn from ${a.sent || "your"} records you allow AI to read. Sources link to the real profiles.${a.remaining != null ? ` ${a.remaining} AI searches left today.` : ""}</div></div>`;
}

function findPaths(target) {

  const add = (key, r) => { if (seen.has(key)) return; seen.add(key); routes.push(r); };
  activePeople().forEach(p => {
    if (has(p.name) || has(p.preferredName)) add("p:" + p.id, { person: p, chain: chainFor(p), why: introducerOf(p) ? `You know ${esc(first(p.name))} through ${esc(introducerOf(p).name)}` : "Direct connection", rank: 5 });
  });
  activePeople().forEach(p => { if (has(p.company)) add("o:" + p.id, { person: p, chain: chainFor(p), target: p.company, why: `${esc(p.name)} is at ${esc(p.company)}${p.role ? " as " + esc(p.role) : ""}`, rank: 4 }); });
  activePeople().forEach(p => { const m = [p.role, p.industry].concat(p.skills || [], p.tags || []).find(has); if (m) add("s:" + p.id, { person: p, chain: chainFor(p), target: m, why: `${esc(p.name)} lists ${esc(m)}`, rank: 3 }); });
  S.exps.forEach(e => { if (e.sourceId && e.sourceId !== "me" && (has(e.topic) || has(e.entity))) { const p = personById(e.sourceId); if (p && !p.archived) add("e:" + p.id + e.topic, { person: p, chain: chainFor(p), target: e.entity || e.topic, why: `${esc(p.name)} has a ${esc((e.type || "record").toLowerCase())} about ${esc(e.topic)}`, rank: 2 }); } });
  activePeople().forEach(p => { if (has(p.metWhere)) add("m:" + p.id, { person: p, chain: chainFor(p), why: `You met ${esc(first(p.name))} at ${esc(p.metWhere)}`, rank: 1 }); });
  return routes.sort((a, b) => b.rank - a.rank || (Number(b.person.strength) || 0) - (Number(a.person.strength) || 0)).slice(0, 25);

  if (!routes.length) return `<div class="empty"><h2>No path to “${esc(target)}” yet</h2><p>No one you've saved is linked to it. Add who works there, who has the skill, or who introduced you.</p></div>`;
  return routes.map(r => {
    const inter = r.chain.length > 2 && r.chain[1].id ? r.chain[1] : null;

async function mergePeople(keepId, dropId) {
  const a = personById(keepId), b = personById(dropId); if (!a || !b) return;
  const m = Object.assign({}, a);
  ["preferredName", "role", "company", "industry", "phone", "whatsapp", "email", "social", "city", "address", "relType", "metType", "metWhere", "metDate", "introducedById", "introducedByName"].forEach(k => { if (!m[k] && b[k]) m[k] = b[k]; });
  if (!hasPhoto(a) && hasPhoto(b)) { m.photo = b.photo || ""; m.photoPath = b.photoPath || ""; b.photoPath = ""; }
  m.skills = uniqCI((a.skills || []).concat(b.skills || [])); m.tags = uniqCI((a.tags || []).concat(b.tags || []));
  const extra = [];
  if (b.phone && normPhone(b.phone) !== normPhone(m.phone) && normPhone(b.phone) !== normPhone(m.whatsapp)) extra.push("Other phone: " + b.phone);
  if (b.email && b.email.toLowerCase() !== String(m.email || "").toLowerCase()) extra.push("Other email: " + b.email);
  m.notes = [a.notes, b.notes].concat(extra).filter(Boolean).join("\n\n");
  m.log = (a.log || []).concat(b.log || []).sort((x, y) => (y.at || "").localeCompare(x.at || "")).slice(0, 200);
  m.strength = Math.max(Number(a.strength) || 0, Number(b.strength) || 0);
  m.lastContacted = [a.lastContacted, b.lastContacted].filter(Boolean).sort().pop() || "";
  m.createdAt = [a.createdAt, b.createdAt].filter(Boolean).sort()[0] || nowISO(); m.updatedAt = nowISO();
  if (m.introducedById === keepId || m.introducedById === dropId) { m.introducedById = ""; }
  await putItem("contacts", m);
  const exps = S.exps.filter(e => e.sourceId === dropId).map(e => Object.assign({}, e, { sourceId: keepId, sourceName: m.name }));
  const fups = S.fups.filter(f => f.personId === dropId).map(f => Object.assign({}, f, { personId: keepId, personName: m.name }));
  const ppl = S.people.filter(p => p.introducedById === dropId && p.id !== keepId).map(p => Object.assign({}, p, { introducedById: keepId }));
  if (exps.length) await putItems("experiences", exps); if (fups.length) await putItems("followups", fups); if (ppl.length) await putItems("contacts", ppl);
  await removeItem("contacts", dropId);
  audit("Merged people", `${b.name} into ${a.name}`);
}
async function deletePerson(id) {
  const p = personById(id); if (!p) return;
  const ppl = S.people.filter(x => x.introducedById === id).map(x => Object.assign({}, x, { introducedById: "", introducedByName: p.name }));

  audit("Deleted person", p.name);
}

async function topicAI(name) {

/* ================= VCF IMPORT ================= */
function decodeQP(str, charset) {
  const bytes = []; for (let i = 0; i < str.length; i++) { if (str[i] === "=" && /^[0-9A-F]{2}$/i.test(str.substr(i + 1, 2))) { bytes.push(parseInt(str.substr(i + 1, 2), 16)); i += 2; } else bytes.push(str.charCodeAt(i)); }
  try { return new TextDecoder(charset || "utf-8").decode(new Uint8Array(bytes)); } catch (e) { try { return decodeURIComponent(bytes.map(b => "%" + b.toString(16).padStart(2, "0")).join("")); } catch (_) { return str; } }
}
function parseVCF(text) {
  const raw = text.replace(/\r\n/g, "\n").split("\n"); const lines = [];
  for (let i = 0; i < raw.length; i++) {
    let l = raw[i];
    if (/^[ \t]/.test(l) && lines.length) { lines[lines.length - 1] += l.slice(1); continue; }
    while (/QUOTED-PRINTABLE/i.test(l) && l.endsWith("=") && i + 1 < raw.length) { l = l.slice(0, -1) + raw[++i]; }
    lines.push(l);
  }
  const cards = []; let cur = null;
  const unesc = v => v.replace(/\\n/gi, "\n").replace(/\\([,;\\])/g, "$1");
  for (const line of lines) {
    if (/^BEGIN:VCARD/i.test(line)) { cur = { phones: [], emails: [] }; continue; }
    if (/^END:VCARD/i.test(line)) { if (cur && (cur.name || cur.nName || cur.phones.length || cur.emails.length)) cards.push(cur); cur = null; continue; }
    if (!cur) continue;
    const idx = line.indexOf(":"); if (idx < 0) continue;
    const left = line.slice(0, idx), val = line.slice(idx + 1);

function fileToJpegBase64(file, maxSide) {
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, (maxSide || 1400) / Math.max(img.width, img.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
      const cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url); res(cv.toDataURL("image/jpeg", .85).split(",")[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("bad image")); };
    img.src = url;
  });
}
async function scanCardFile(file) {

  const entryRef = Sheet.top();

    if (cancelled || Sheet.top() !== entryRef) return;
    const pre = Object.assign({}, r.person || {}, { source: "card", metType: (r.person && r.person.metType) || "Event" });
    Sheet.replace(personForm(null, pre));

    if (cancelled) return;
    if (Sheet.top() === entryRef) Sheet.back();
    toast(e && e.message === "bad image" ? "That photo couldn't be read. Try another one." : aiErrorText(e));
  }
}

function parseCSV(text) {
  const rows = []; let row = [], field = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; } else field += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { row.push(field); field = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(field); rows.push(row); row = []; field = ""; }
    else field += ch;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows;
}
function csvToCards(text) {
  const rows = parseCSV(String(text || "").replace(/^\ufeff/, "")).filter(r => r.some(c => String(c).trim()));
  const hIdx = rows.slice(0, 12).findIndex(r => r.some(c => /^(first name|given name|name|full name|display name)$/i.test(String(c).trim())));
  if (hIdx < 0) return { cards: [], linkedin: false };
  const H = rows[hIdx].map(h => String(h).trim().toLowerCase());
  const col = (...names) => { for (const n of names) { const i = H.indexOf(n); if (i >= 0) return i; } return -1; };
  const cols = re => H.map((h, i) => re.test(h) ? i : -1).filter(i => i >= 0);
  const linkedin = H.includes("connected on") && H.includes("url");
  const iFirst = col("first name", "given name"), iMid = col("middle name", "additional name"), iLast = col("last name", "family name"), iName = col("name", "full name", "display name");
  const phoneCols = cols(/^(phone|phone number|mobile|mobile phone|primary phone|home phone|business phone|work phone|other phone|phone \d+ - value)$/);
  const emailCols = cols(/^(e-?mail|e-?mail address|email address|e-?mail \d+ - value)$/);
  const iCompany = col("company", "organization", "organization name", "organization 1 - name"), iTitle = col("position", "job title", "title", "organization title", "organization 1 - title");
  const iUrl = col("url", "website", "website 1 - value", "web page"), iNotes = col("notes"), iCity = col("city", "address 1 - city", "home city", "business city"), iConnected = col("connected on");
  const get = (r, i) => i >= 0 ? String(r[i] || "").trim() : "";
  const cards = [];
  for (const r of rows.slice(hIdx + 1)) {
    const name = [get(r, iFirst), get(r, iMid), get(r, iLast)].filter(Boolean).join(" ") || get(r, iName);
    const phones = [].concat(...phoneCols.map(i => get(r, i).split(/\s*:::\s*/))).filter(Boolean);
    const emails = [].concat(...emailCols.map(i => get(r, i).split(/\s*:::\s*/))).filter(Boolean);
    if (!name && !phones.length && !emails.length) continue;
    let metDate = ""; const cd = get(r, iConnected); if (cd) { const t = new Date(cd); if (!isNaN(t)) metDate = localDate(t); }
    cards.push({ name, display: name || phones[0] || emails[0], phones, emails, company: get(r, iCompany), role: get(r, iTitle), url: get(r, iUrl), note: get(r, iNotes), city: get(r, iCity),
      metType: linkedin ? "Online" : "", metWhere: linkedin ? "LinkedIn" : "", metDate, source: linkedin ? "linkedin" : "imported" });
  }
  return { cards, linkedin };
}
async function unzipFirstCsv(file) {
  const buf = new Uint8Array(await file.arrayBuffer()); const dv = new DataView(buf.buffer);
  let eocd = -1; for (let i = buf.length - 22; i >= Math.max(0, buf.length - 66000); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error("not a zip");
  const count = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true); const entries = [];
  for (let n = 0; n < count && dv.getUint32(p, true) === 0x02014b50; n++) {
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true), nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    entries.push({ name: new TextDecoder().decode(buf.subarray(p + 46, p + 46 + nlen)), method, csize, off });
    p += 46 + nlen + elen + clen;
  }
  const pickE = entries.find(e => /(^|\/)connections\.csv$/i.test(e.name)) || entries.find(e => /\.csv$/i.test(e.name));
  if (!pickE) throw new Error("no csv");
  const lo = pickE.off, start = lo + 30 + dv.getUint16(lo + 26, true) + dv.getUint16(lo + 28, true);
  const data = buf.subarray(start, start + pickE.csize);
  if (pickE.method === 0) return { name: pickE.name, text: new TextDecoder().decode(data) };
  if (pickE.method !== 8 || typeof DecompressionStream === "undefined") throw new Error("unsupported zip");
  const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return { name: pickE.name, text: await new Response(stream).text() };
}
async function importCsvFile(file) {
  try {
    let text, name = file.name;
    if (/\.zip$/i.test(file.name) || file.type === "application/zip") { const r = await unzipFirstCsv(file); text = r.text; name = r.name.split("/").pop(); }
    else text = await readText(file);
    const { cards, linkedin } = csvToCards(text);
    if (!cards.length) { toast("No contacts found. Use LinkedIn's Connections.csv or a contacts CSV with a name column."); return; }
    Sheet.closeAll(); Sheet.open(importSheet(cards, linkedin ? "LinkedIn connections" : name));
  } catch (e) { toast(/zip/.test(String(e && e.message)) ? "That zip couldn't be opened. Extract Connections.csv and choose it instead." : "That file couldn't be read."); }
}

const GLINK = "reach.googleLinkPending";
const GOOGLE_SCOPE = "https://www.googleapis.com/auth/contacts.readonly";
function applyGoogle(r) { if (!r) return; S.google = Object.assign({}, S.google, { checked: true, error: false, syncing: false }, r); scheduleRender(); }
function googleResultText(r) {
  const x = r && r.lastResult; if (!x) return r && r.needsReconnect ? "Google access expired. Reconnect Google Contacts." : "Google Contacts connected";
  return `Google Contacts synced: ${x.added} new, ${x.linked} matched${x.photos ? `, ${x.photos} photos` : ""}`;
}
function googleErrorText(e) {
  switch (e && e.code) {
    case "google_not_configured": return "Google sync isn't set up on your server yet. Add GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET in Supabase secrets.";
    case "google_reconnect": return "Google access expired. Tap Reconnect.";
    case "google_permission": return "Google didn't allow contact access. Make sure the People API is enabled and you ticked contacts when Google asked.";
    case "server_misconfigured": return "The server function is missing its service key. Redeploy reach-ai.";
    case "not_deployed": return "Update the reach-ai server function first (setup guide, Google step).";
    case "offline": return "You're offline.";
    default: return "Google sync didn't finish. Try again later.";
  }
}
function googleLinkErrorText(desc) {
  const d = String(desc || "");
  if (/manual linking/i.test(d)) return "Turn on Allow manual linking in Supabase Authentication settings, then try again.";
  if (/already.*(linked|exists)|identity.*exist/i.test(d)) return "That Google account is already connected to a different Reach account.";
  if (/provider.*(not enabled|disabled)|unsupported provider/i.test(d)) return "Google isn't enabled in Supabase yet. Follow the Google step in the setup guide.";
  if (/access_denied|denied/i.test(d)) return "Google access was cancelled.";
  return d ? "Google didn't connect: " + d : "Google didn't give contact access. Try again and allow it.";
}
async function googleConnect() {
  if (!navigator.onLine) { toast("Connect to the internet first."); return; }
  if (!S.googleAuth) { toast("Google isn't enabled in Supabase yet. Follow the Google step in the setup guide."); return; }
  try { localStorage.setItem(GLINK, String(Date.now())); } catch (e) { }
  const options = { redirectTo: appUrl(), scopes: GOOGLE_SCOPE, queryParams: { access_type: "offline", prompt: "consent" } };
  const linked = ((S.user && S.user.identities) || []).some(i => i.provider === "google");
  const { error } = linked ? await sb.auth.signInWithOAuth({ provider: "google", options }) : await sb.auth.linkIdentity({ provider: "google", options });
  if (error) { try { localStorage.removeItem(GLINK); } catch (e) { } toast(googleLinkErrorText(error.message)); }
}
async function finishGoogleLink() {
  let pending = null; try { pending = localStorage.getItem(GLINK); } catch (e) { }
  if (!pending || !S.user) return;
  const hashErr = (location.hash.match(/error_description=([^&]+)/) || [])[1];
  const session = S.lastSession;
  if (session && session.provider_refresh_token) {
    try { localStorage.removeItem(GLINK); } catch (e) { }
    S.google = Object.assign({}, S.google, { syncing: true }); scheduleRender(); toast("Connecting Google Contacts…");
    try {
      const r = await invokeAI({ action: "google_connect", refreshToken: session.provider_refresh_token });
      applyGoogle(r); toast(googleResultText(r)); await pull(true);
    } catch (e) { S.google = Object.assign({}, S.google, { syncing: false }); toast(googleErrorText(e)); }
    sb.auth.refreshSession().catch(() => { });
  } else if (hashErr || Date.now() - Number(pending) > 10 * 60000) {
    try { localStorage.removeItem(GLINK); } catch (e) { }
    toast(googleLinkErrorText(decodeURIComponent(hashErr || "").replace(/\+/g, " ")));
    if (hashErr) history.replaceState(null, "", location.pathname + location.search);
  }
}
async function googleAutoSync(force) {
  if (!sb || !S.user || !navigator.onLine) return;
  let st; try { st = await invokeAI({ action: "google_status" }); } catch (e) { S.google = Object.assign({}, S.google, { checked: true, error: e.code || true }); scheduleRender(); return; }
  applyGoogle(st);
  const due = st.connected && (force || !st.lastSync || Date.now() - Date.parse(st.lastSync) > 12 * 3600e3);
  if (!due) return;
  S.google.syncing = true; scheduleRender();
  try {
    const r = await invokeAI({ action: "google_sync", force: !!force }); applyGoogle(r);
    if (force) toast(googleResultText(r));
    else if (r.lastResult && r.lastResult.added) toast(`${r.lastResult.added} new ${r.lastResult.added === 1 ? "person" : "people"} added from Google Contacts`);
    if (r.needsReconnect) toast("Google access expired. Reconnect it in You.");
    await pull(true);
  } catch (e) { S.google.syncing = false; if (force) toast(googleErrorText(e)); scheduleRender(); }
}
async function googleDisconnect() {
  try { const r = await invokeAI({ action: "google_disconnect" }); applyGoogle(Object.assign({ needsReconnect: false, email: "", lastSync: null, lastResult: null }, r)); toast("Google Contacts disconnected. People already imported stay."); }
  catch (e) { toast(googleErrorText(e)); }

/* ================= SHARE INTO REACH ================= */
async function consumeShare() {
  if (!/[?&]shared=1/.test(location.search) || !S.user) return;
  history.replaceState(null, "", location.pathname + location.hash);
  if (!("caches" in window)) return;
  try {
    const cache = await caches.open("reach-share"); const base = new URL("./", location.href);
    const pRes = await cache.match(new URL("__shared/payload", base).href); if (!pRes) return;
    const payload = await pRes.json(); await cache.delete(new URL("__shared/payload", base).href);
    const files = [];
    for (const f of payload.files || []) { const r = await cache.match(f.key); if (r) { files.push(new File([await r.blob()], f.name || "shared", { type: f.type || r.headers.get("content-type") || "" })); await cache.delete(f.key); } }
    audit("Shared into Reach", [files.map(f => f.name).join(", "), trunc(payload.title || "", 40)].filter(Boolean).join(" "));
    const vcf = files.find(f => /vcard|directory/i.test(f.type) || /\.vcf$/i.test(f.name));
    const csv = files.find(f => /csv|zip/i.test(f.type) || /\.(csv|zip)$/i.test(f.name));
    const img = files.find(f => /^image\//.test(f.type));
    if (vcf) {
      const cards = parseVCF(await readText(vcf));
      if (cards.length === 1) { const c = cards[0]; Sheet.closeAll(); Sheet.open(personForm(null, { source: "shared", name: c.display, phone: c.phones[0] || "", email: c.emails[0] || "", company: c.company || "", role: c.role || "", city: c.city || "", social: c.url || "", notes: [c.note, c.phones.length > 1 ? "Other numbers: " + c.phones.slice(1).join(", ") : ""].filter(Boolean).join("\n"), photo: await photoFromVcf(c) })); return; }
      if (cards.length) { Sheet.closeAll(); Sheet.open(importSheet(cards, "shared contacts")); return; }
    }
    if (csv) { importCsvFile(csv); return; }
    if (img) { Sheet.closeAll(); Sheet.open(sharedImageSheet(img)); return; }
    const text = [payload.title, payload.text, payload.url].filter(Boolean).join("\n").trim();
    if (text) { Sheet.closeAll(); Sheet.open(quickAddSheet(text)); return; }
    toast("Nothing Reach can use was shared.");
  } catch (e) { toast("Couldn't open what you shared. Try again."); }
}
function sharedImageSheet(file) {
  return { title: "Shared image", form: true, file, render: () => `<p class="note" style="margin-top:4px">What is this image?</p>
    <div style="display:grid;gap:10px">${aiAvailable() ? `<button class="btn dark" data-a="shareScan">${ICON.camera} A business card: read the details</button>` : ""}<button class="btn ghost" data-a="sharePhoto">${ICON.user} A person's photo: add someone new</button></div>` };

function textToPrefill(text) {
  const phone = (text.match(/(\+?\d[\d\s-]{8,}\d)/) || [])[1] || ""; const email = (text.match(/[\w.+-]+@[\w-]+\.[\w.]+/) || [])[0] || "";
  return { source: "shared", phone: phone.replace(/\s+/g, " ").trim(), email, notes: text };
}

async function createCampaign(form, fd) {
  const entry = Sheet.top(); const g = k => String(fd.get(k) || "").trim();
  const people = activePeople().filter(p => entry.sel.has(p.id) && p.email && !p.noEmail);
  if (!g("name") || !g("subject") || !g("body")) { toast("Add a name, a subject and a message."); return; }
  if (!people.length) { toast("Tick the people who should get this."); return; }
  if (people.length > CAMP_MAX) { toast(`Campaigns are limited to ${CAMP_MAX} people. Untick some.`); return; }
  if (!navigator.onLine) { toast("Connect to the internet to create a campaign."); return; }
  const id = uid("c"); const now = nowISO();
  const data = { name: g("name"), subject: g("subject"), body: g("body"), provider: g("provider") === "service" ? "service" : "gmail", dailyCap: Math.max(1, Math.min(400, Number(g("dailyCap")) || 50)), status: "draft", total: people.length, sentCount: 0, createdAt: now };
  const rows = people.map(p => ({ owner_id: S.user.id, campaign_id: id, person_id: p.id, name: p.name, email: p.email, vars: { first: first(p.name), name: p.name, company: p.company || "", role: p.role || "", city: p.city || "" }, status: "pending" }));
  try {
    const { error } = await sb.from("campaigns").insert({ owner_id: S.user.id, id, data }); if (error) throw error;
    for (let i = 0; i < rows.length; i += 400) { const { error: e2 } = await sb.from("campaign_recipients").insert(rows.slice(i, i + 400)); if (e2) throw e2; }
    audit("Created email campaign", `${data.name}: ${people.length} recipients`);
    S.camps.list = [Object.assign({ id, createdAt: now }, data)].concat(S.camps.list || []);
    Sheet.replace(campaignSheet(id)); toast(`Campaign ready for ${people.length} people`);
  } catch (e) { toast("Couldn't create the campaign. Check your connection and try again."); }
}

function campErrText(code) {
  return { gmail_scope: "Gmail sending permission is missing. In You, disconnect Google, connect it again and allow sending email.",
    google_reconnect: "Google access expired. Reconnect it in You.",
    service_not_configured: "Your email service isn't set up. Add RESEND_API_KEY and REACH_FROM_EMAIL in Supabase secrets.",
    service_key_invalid: "The email service rejected your API key.",
    send_limit: "Today's sending limit was reached. Tap Continue sending tomorrow." }[code] || (code ? "Sending stopped: " + code : "");
}
async function refreshCampaign(id) {
  if (!sb || !S.user || !navigator.onLine) return;
  try {
    const [stats, rows, camp] = await Promise.all([campStats(id),
      sb.from("campaign_recipients").select("person_id,name,email,status,error").eq("owner_id", S.user.id).eq("campaign_id", id).order("status").limit(60),
      sb.from("campaigns").select("data").eq("owner_id", S.user.id).eq("id", id).maybeSingle()]);
    S.campStats[id] = stats; S.campList[id] = rows.data || [];
    if (camp.data) { const i = (S.camps.list || []).findIndex(x => x.id === id); if (i >= 0) S.camps.list[i] = Object.assign({ id }, camp.data.data); }
    Sheet.refresh(); scheduleRender();
  } catch (e) { }
}
async function runCampaign(id) {
  if (!navigator.onLine) { toast("You're offline."); return; }
  S.campRun = { id, stop: false }; Sheet.refresh();
  let sentTotal = 0;
  while (S.campRun && S.campRun.id === id && !S.campRun.stop) {
    let r;
    try { r = await invokeAI({ action: "campaign_run", campaignId: id }); }
    catch (e) { toast(campErrText(e.code) || "Sending stopped."); break; }
    sentTotal += r.sent || 0;
    const i = (S.camps.list || []).findIndex(x => x.id === id);
    if (i >= 0) S.camps.list[i] = Object.assign({}, S.camps.list[i], { status: r.status, sentCount: (S.camps.list[i].sentCount || 0) + (r.sent || 0), lastError: r.stopCode || null });
    S.campStats[id] = Object.assign({}, S.campStats[id], { pending: r.remaining });
    Sheet.refresh();
    if (r.status !== "sending") {
      if (r.status === "waiting") toast(`Daily limit reached. ${sentTotal} sent, the rest continues tomorrow.`);
      else if (r.status === "done") toast(`Campaign finished. ${sentTotal} sent in this run.`);
      else if (r.stopCode) toast(campErrText(r.stopCode));
      break;
    }
    await new Promise(res => setTimeout(res, 700));
  }
  S.campRun = null; refreshCampaign(id); Sheet.refresh();
}

async function campaignDraft() {

    const r = await invokeAI({ action: "parse", text: `Write a short, polite email for this purpose: "${name}". The recipients are people I already know${sample ? `, for example: ${sample}` : ""}. Reply in this exact shape and nothing else, using {{first}} where their first name goes and {{me}} where my name goes: SUBJECT: <one line> BODY: <3 to 6 short lines>` });

  } catch (e) { toast(aiErrorText(e)); }

}

const appUrl = () => location.origin + location.pathname;
function authError(e) {
  const m = String((e && e.message) || "").toLowerCase();
  if (m.includes("invalid login")) return "That email and password don't match.";
  if (m.includes("email not confirmed")) return "Confirm your email first. Open the link we sent you, then sign in.";
  if (m.includes("already registered") || m.includes("already been registered")) return "An account with this email already exists. Sign in instead.";
  if (m.includes("rate limit") || m.includes("too many")) return "Too many attempts. Wait a while, then try again.";
  if (m.includes("not authorized") || m.includes("email address not authorized")) return "This server can't send email to that address yet. The app owner needs to set up email sending (see the setup guide).";
  if (m.includes("password") && m.includes("characters")) return "Use a password with at least 8 characters.";
  if (m.includes("failed to fetch") || m.includes("network")) return "You're offline. Connect to the internet and try again.";
  return (e && e.message) || "Something went wrong. Try again.";
}

      <div class="auth-links"><button class="link" data-a="authMode" data-mode="signup">Create an account</button><button class="link" data-a="authMode" data-mode="forgot">Forgot password?</button></div>`,
    signup: `<h1 class="auth-h">Create your account</h1><p class="muted">Only you can see the people and notes you save.</p>${msg}
      <form data-form="signup"><label class="f">Email<input name="email" type="email" autocomplete="email" inputmode="email" required></label>

      <button class="btn dark" style="width:100%" type="submit">Create account</button></form>

      <div class="auth-links"><button class="link" data-a="authMode" data-mode="signin">I already have an account</button></div>`,
    forgot: `<h1 class="auth-h">Reset your password</h1><p class="muted">We'll email you a link to set a new one.</p>${msg}
      <form data-form="forgot"><label class="f">Email<input name="email" type="email" autocomplete="email" inputmode="email" required></label>

      <form data-form="newpass"><label class="f">New password <small>(at least 8 characters)</small><input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
      <button class="btn dark" style="width:100%" type="submit">Save password</button></form>`,

  };

async function withBusy(form, label, fn) {

  try { await fn(); } finally { if (document.body.contains(btn)) { btn.disabled = false; btn.textContent = old; } }
}

function startSession(user) {

}

/* ================= BOOT ================= */
async function boot() {
  try { const th = localStorage.getItem("reach.theme"); if (th) document.documentElement.setAttribute("data-theme", th); } catch (e) { }
  $$(".tabs .tab").forEach(b => { b.innerHTML = b.innerHTML.replace(/<!--I:(\w+)-->/g, (_, k) => ICON[k] || ""); });
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("./sw.js").catch(() => { });
  const cfg = window.REACH_CONFIG || {};
  if (!window.supabase || !cfg.supabaseUrl || !cfg.supabaseKey || /PASTE|YOUR/i.test(cfg.supabaseUrl + cfg.supabaseKey)) { showAuth("setup"); return; }
  sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  if (typeof fetch === "function") fetch(cfg.supabaseUrl.replace(/\/$/, "") + "/auth/v1/settings", { headers: { apikey: cfg.supabaseKey } }).then(r => r.ok ? r.json() : null).then(j => { const on = !!(j && j.external && j.external.google); if (on !== S.googleAuth) { S.googleAuth = on; if (!$("#authView").hidden && !$("#authView .err") && $("#authView [data-form=signin]")) showAuth("signin"); scheduleRender(); } }).catch(() => { });
  sb.auth.onAuthStateChange((event, session) => {
    if (session) S.lastSession = session;
    setTimeout(() => {
      if (event === "PASSWORD_RECOVERY") { recoveryMode = true; showAuth("reset"); return; }
      if (event === "SIGNED_OUT") { if (S.user) { endSession(); showAuth("signin"); } return; }
      if (session && session.user && !recoveryMode) startSession(session.user);
    }, 0);
  });
  const { data } = await sb.auth.getSession().catch(() => ({ data: {} }));
  if (data && data.session) S.lastSession = data.session;
  if (recoveryMode) { showAuth("reset"); return; }
  if (data && data.session && data.session.user) startSession(data.session.user);
  else if (!S.user) showAuth("signin", /error_description=/.test(location.hash) ? decodeURIComponent((location.hash.match(/error_description=([^&]+)/) || [])[1] || "").replace(/\+/g, " ") : "", true);
}
window.addEventListener("online", () => { setSync(); flush().then(() => pull(true)); if (S.aiServer === "unknown") checkAIStatus(); scheduleRender(); });
window.addEventListener("offline", () => { setSync(); scheduleRender(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.user) { pull(false); } else if (document.visibilityState === "hidden" && S.user) { flush(); } });
setInterval(() => { if (S.user && document.visibilityState === "visible") pull(false); }, 5 * 60000);
boot();
})();
